# ============================================================
# Xporadia Backend — Pipeline CD
# develop → staging auto
# main → production auto (après MVP validé)
# ============================================================
name: CD — Backend Deploy

on:
  push:
    branches: [develop, main]

jobs:
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /var/www/xporadia-backend
            git pull origin develop
            source venv/bin/activate
            pip install -r requirements/prod.txt

            # Synchronise .env avec le secret GitHub (si configuré) sans
            # jamais l'écraser par du vide : le pipeline ne connaissait
            # jusqu'ici que les identifiants SSH, aucune variable d'app
            # n'atteignait réellement le serveur — d'où l'email de
            # vérification qui ne partait jamais malgré une clé "configurée"
            # côté GitHub.
            SENDGRID_KEY="${{ secrets.SENDGRID_API_KEY }}"
            if [ -n "$SENDGRID_KEY" ]; then
              if grep -q "^SENDGRID_API_KEY=" .env; then
                sed -i "s|^SENDGRID_API_KEY=.*|SENDGRID_API_KEY=$SENDGRID_KEY|" .env
              else
                echo "SENDGRID_API_KEY=$SENDGRID_KEY" >> .env
              fi
            fi

            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart xporadia-api
            sudo systemctl restart xporadia-celery
            echo "✅ Staging déployé"

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production (Blue-Green)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /var/www/xporadia-backend
            git pull origin main
            source venv/bin/activate
            pip install -r requirements/prod.txt

            # Synchronise .env avec le secret GitHub (si configuré) sans
            # jamais l'écraser par du vide : le pipeline ne connaissait
            # jusqu'ici que les identifiants SSH, aucune variable d'app
            # n'atteignait réellement le serveur — d'où l'email de
            # vérification qui ne partait jamais malgré une clé "configurée"
            # côté GitHub.
            SENDGRID_KEY="${{ secrets.SENDGRID_API_KEY }}"
            if [ -n "$SENDGRID_KEY" ]; then
              if grep -q "^SENDGRID_API_KEY=" .env; then
                sed -i "s|^SENDGRID_API_KEY=.*|SENDGRID_API_KEY=$SENDGRID_KEY|" .env
              else
                echo "SENDGRID_API_KEY=$SENDGRID_KEY" >> .env
              fi
            fi

            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart xporadia-api
            sudo systemctl restart xporadia-celery
            echo "✅ Production déployée"
