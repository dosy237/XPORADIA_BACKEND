# ============================================================
# Xporadia — Docker Compose PRODUCTION
# Usage : docker compose -f docker-compose.prod.yml up -d --build
# Toutes les variables sensibles viennent de .env (jamais commité) :
# voir .env.example pour la liste complète des clés attendues.
# ============================================================

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Port interne 5440 (au lieu du 5432 par défaut de l'image) — jamais
    # publié sur l'hôte : seuls les conteneurs du même réseau (api,
    # celery_worker, celery_beat) y accèdent, via le nom de service "db".
    command: -p 5440
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5440"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5440"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      target: prod
    env_file:
      - .env
    # Port interne 9110 — publié sur l'hôte pour être atteint depuis
    # l'extérieur (directement, ou via un reverse proxy Nginx devant).
    ports:
      - "9110:9110"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      target: prod
    env_file:
      - .env
    # entrypoint vidé : entry.sh (migrate + collectstatic) ne doit
    # tourner qu'une fois, côté "api" — pas à chaque worker Celery.
    entrypoint: []
    command: celery -A config worker --loglevel=info
    depends_on:
      - api
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      target: prod
    env_file:
      - .env
    entrypoint: []
    command: sh -c "sleep 15 && celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      - celery_worker
    restart: unless-stopped

volumes:
  postgres_data:
